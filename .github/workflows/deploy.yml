name: Deploy Project Dashboard AI Documentation

on:
  push:
    branches:
      - gh-pages


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Build Docusaurus
        run: npm run build


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build



  deploy:

    needs: build

    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
